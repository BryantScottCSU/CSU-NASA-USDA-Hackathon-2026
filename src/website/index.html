<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fruit Fly Detections Map</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <!-- Leaflet Heat Plugin -->
  <script
    src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js">
  </script>

  <style>
    :root {
      --panel-bg: #ffffff;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #656d76;
      --accent: #0969da;
      --shadow: 0 8px 24px rgba(140, 149, 159, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    body {
      display: grid;
      grid-template-columns: 360px 1fr;
      background: #f6f8fa;
    }

    #sidebar {
      height: 100vh;
      overflow-y: auto;
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      padding: 18px;
      z-index: 1000;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      line-height: 1.2;
    }

    .subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .section {
      margin-bottom: 18px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    label {
      display: block;
      margin: 10px 0 5px;
      font-size: 13px;
      font-weight: 650;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: white;
    }

    input:focus,
    select:focus {
      outline: 2px solid rgba(9, 105, 218, 0.25);
      border-color: var(--accent);
    }

    button {
      margin-top: 10px;
      cursor: pointer;
      background: var(--accent);
      color: white;
      border: none;
      font-weight: 650;
    }

    button.secondary {
      background: #6e7781;
    }

    button:hover {
      filter: brightness(0.95);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat-card {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #f6f8fa;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 750;
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .legend {
      line-height: 1.6;
      font-size: 13px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .swatch {
      width: 18px;
      height: 18px;
      border: 1px solid #333;
      display: inline-block;
    }

    .note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .leaflet-popup-content {
      font-size: 14px;
      line-height: 1.45;
    }

    .popup-title {
      font-weight: 750;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .error-box {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      background: #ffebe9;
      border: 1px solid #ff8182;
      color: #82071e;
      font-size: 13px;
      display: none;
    }

    @media (max-width: 800px) {
      body {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }

      #sidebar {
        height: auto;
        max-height: 45vh;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      #map {
        height: 55vh;
      }
    }
  </style>
</head>

<body>
  <aside id="sidebar">
    <h1>Fruit Fly Detections</h1>
    <p class="subtitle">
      Interactive map from preprocessed <code>fruit_fly_data.geojson</code>.
    </p>

    <div class="section">
      <div class="stats-grid">
        <div class="stat-card">
          <div id="visibleFeatures" class="stat-value">0</div>
          <div class="stat-label">Visible records</div>
        </div>

        <div class="stat-card">
          <div id="visibleCount" class="stat-value">0</div>
          <div class="stat-label">Total count</div>
        </div>

        <div class="stat-card">
          <div id="uniqueStates" class="stat-value">0</div>
          <div class="stat-label">States</div>
        </div>

        <div class="stat-card">
          <div id="uniqueFlies" class="stat-value">0</div>
          <div class="stat-label">Fly types</div>
        </div>
      </div>
    </div>

    <div class="section">
      <label for="stateFilter">State</label>
      <select id="stateFilter">
        <option value="">All states</option>
      </select>

      <label for="flyFilter">Common name</label>
      <select id="flyFilter">
        <option value="">All fruit flies</option>
      </select>

      <label for="monthFilter">Month/Year</label>
      <select id="monthFilter">
        <option value="">All months</option>
      </select>

      <label for="countySearch">County search</label>
      <input
        id="countySearch"
        type="text"
        placeholder="Example: Los Angeles"
      />

      <button id="applyFilters">Apply filters</button>
      <button id="resetFilters" class="secondary">Reset filters</button>
    </div>

    <div class="section">
      <label>
        <input
          id="togglePolygons"
          type="checkbox"
          checked
          style="width: auto; margin-right: 6px;"
        />
        Show county polygons
      </label>

      <label>
        <input
          id="toggleHeatmap"
          type="checkbox"
          checked
          style="width: auto; margin-right: 6px;"
        />
        Show heatmap overlay
      </label>
    </div>

    <div class="section">
      <strong>Legend</strong>
      <div class="legend" id="legend"></div>
    </div>

    <p class="note">
      Note: if your GeoJSON contains repeated county polygons for different
      months or species, the map is visualizing records, not unique counties.
    </p>

    <div id="errorBox" class="error-box"></div>
  </aside>

  <main id="map"></main>

  <script>
    const GEOJSON_PATH = "fruit_fly_data.geojson";

    let rawGeoJson = null;
    let currentGeoJson = null;
    let polygonLayer = null;
    let heatLayer = null;

    const map = L.map("map", {
      preferCanvas: true
    }).setView([37.8, -96], 4);

    const baseOSM = L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }
    );

    const baseCarto = L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
      {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors &copy; CARTO"
      }
    );

    baseCarto.addTo(map);

    const baseLayers = {
      "Light map": baseCarto,
      "OpenStreetMap": baseOSM
    };

    L.control.layers(baseLayers, null, { collapsed: false }).addTo(map);

    const stateFilter = document.getElementById("stateFilter");
    const flyFilter = document.getElementById("flyFilter");
    const monthFilter = document.getElementById("monthFilter");
    const countySearch = document.getElementById("countySearch");

    document.getElementById("applyFilters").addEventListener("click", applyFilters);
    document.getElementById("resetFilters").addEventListener("click", resetFilters);
    document.getElementById("togglePolygons").addEventListener("change", redrawLayers);
    document.getElementById("toggleHeatmap").addEventListener("change", redrawLayers);

    countySearch.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        applyFilters();
      }
    });

    function showError(message) {
      const box = document.getElementById("errorBox");
      box.style.display = "block";
      box.textContent = message;
    }

    function getProp(feature, key, fallback = "") {
      return feature?.properties?.[key] ?? fallback;
    }

    function getCount(feature) {
      const value = Number(getProp(feature, "count", 0));
      return Number.isFinite(value) ? value : 0;
    }

    function uniqueSorted(features, propertyName) {
      const values = new Set();

      for (const feature of features) {
        const value = getProp(feature, propertyName, "");
        if (value !== null && value !== undefined && String(value).trim() !== "") {
          values.add(String(value));
        }
      }

      return Array.from(values).sort((a, b) => a.localeCompare(b));
    }

    function fillSelect(selectElement, values, allLabel) {
      selectElement.innerHTML = "";

      const allOption = document.createElement("option");
      allOption.value = "";
      allOption.textContent = allLabel;
      selectElement.appendChild(allOption);

      for (const value of values) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        selectElement.appendChild(option);
      }
    }

    function setupFilters(geojson) {
      const features = geojson.features || [];

      fillSelect(stateFilter, uniqueSorted(features, "state"), "All states");
      fillSelect(flyFilter, uniqueSorted(features, "common_name"), "All fruit flies");
      fillSelect(monthFilter, uniqueSorted(features, "monthyear"), "All months");
    }

    function maxCount(features) {
      let max = 0;

      for (const feature of features) {
        max = Math.max(max, getCount(feature));
      }

      return max;
    }

    function getColor(count, max) {
      if (max <= 0) return "#ffffcc";

      const t = count / max;

      if (t <= 0) return "#f7f7f7";
      if (t < 0.20) return "#ffffcc";
      if (t < 0.40) return "#ffeda0";
      if (t < 0.60) return "#feb24c";
      if (t < 0.80) return "#f03b20";
      return "#bd0026";
    }

    function makeStyle(max) {
      return function style(feature) {
        const count = getCount(feature);

        return {
          fillColor: getColor(count, max),
          color: "#24292f",
          weight: 0.6,
          opacity: 0.9,
          fillOpacity: 0.55
        };
      };
    }

    function highlightFeature(event) {
      const layer = event.target;

      layer.setStyle({
        weight: 2,
        color: "#0969da",
        fillOpacity: 0.75
      });

      layer.bringToFront();
    }

    function resetHighlight(event) {
      if (polygonLayer) {
        polygonLayer.resetStyle(event.target);
      }
    }

    function onEachFeature(feature, layer) {
      const p = feature.properties || {};

      const popupHtml = `
        <div class="popup-title">${escapeHtml(p.county || "Unknown county")}</div>
        <div><strong>State:</strong> ${escapeHtml(p.state || "Unknown")}</div>
        <div><strong>Month/Year:</strong> ${escapeHtml(p.monthyear || "Unknown")}</div>
        <div><strong>Common name:</strong> ${escapeHtml(p.common_name || "Unknown")}</div>
        <div><strong>Count:</strong> ${Number(p.count || 0).toLocaleString()}</div>
        <div><strong>Object ID:</strong> ${escapeHtml(String(p.OBJECTID ?? ""))}</div>
      `;

      layer.bindPopup(popupHtml);

      layer.bindTooltip(
        `${p.county || "Unknown"}: ${Number(p.count || 0).toLocaleString()}`,
        {
          sticky: true
        }
      );

      layer.on({
        mouseover: highlightFeature,
        mouseout: resetHighlight
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getCentroidFromCoordinates(geometry) {
      if (!geometry) return null;

      try {
        if (geometry.type === "Polygon") {
          return averageRing(geometry.coordinates[0]);
        }

        if (geometry.type === "MultiPolygon") {
          let points = [];

          for (const polygon of geometry.coordinates) {
            if (polygon && polygon[0]) {
              points = points.concat(polygon[0]);
            }
          }

          return averageRing(points);
        }
      } catch {
        return null;
      }

      return null;
    }

    function averageRing(points) {
      if (!points || points.length === 0) return null;

      let sumLon = 0;
      let sumLat = 0;
      let n = 0;

      for (const point of points) {
        if (!point || point.length < 2) continue;

        const lon = Number(point[0]);
        const lat = Number(point[1]);

        if (!Number.isFinite(lon) || !Number.isFinite(lat)) continue;

        sumLon += lon;
        sumLat += lat;
        n += 1;
      }

      if (n === 0) return null;

      return {
        lon: sumLon / n,
        lat: sumLat / n
      };
    }

    function buildHeatPoints(features) {
      const points = [];

      for (const feature of features) {
        const centroid = getCentroidFromCoordinates(feature.geometry);
        const count = getCount(feature);

        if (!centroid || count <= 0) continue;

        points.push([centroid.lat, centroid.lon, count]);
      }

      return points;
    }

    function redrawLayers() {
      if (!currentGeoJson) return;

      if (polygonLayer) {
        map.removeLayer(polygonLayer);
        polygonLayer = null;
      }

      if (heatLayer) {
        map.removeLayer(heatLayer);
        heatLayer = null;
      }

      const features = currentGeoJson.features || [];
      const max = maxCount(features);

      if (document.getElementById("togglePolygons").checked) {
        polygonLayer = L.geoJSON(currentGeoJson, {
          style: makeStyle(max),
          onEachFeature: onEachFeature
        }).addTo(map);
      }

      if (document.getElementById("toggleHeatmap").checked) {
        const heatPoints = buildHeatPoints(features);

        heatLayer = L.heatLayer(heatPoints, {
          radius: 28,
          blur: 22,
          maxZoom: 9
        }).addTo(map);
      }

      updateStats(features);
      updateLegend(max);

      const layerForBounds = polygonLayer || L.geoJSON(currentGeoJson);

      try {
        const bounds = layerForBounds.getBounds();

        if (bounds.isValid()) {
          map.fitBounds(bounds.pad(0.08));
        }
      } catch {
        // Ignore invalid bounds.
      }
    }

    function applyFilters() {
      if (!rawGeoJson) return;

      const selectedState = stateFilter.value;
      const selectedFly = flyFilter.value;
      const selectedMonth = monthFilter.value;
      const countyNeedle = countySearch.value.trim().toLowerCase();

      const filteredFeatures = rawGeoJson.features.filter(feature => {
        const state = String(getProp(feature, "state", ""));
        const fly = String(getProp(feature, "common_name", ""));
        const month = String(getProp(feature, "monthyear", ""));
        const county = String(getProp(feature, "county", "")).toLowerCase();

        if (selectedState && state !== selectedState) return false;
        if (selectedFly && fly !== selectedFly) return false;
        if (selectedMonth && month !== selectedMonth) return false;
        if (countyNeedle && !county.includes(countyNeedle)) return false;

        return true;
      });

      currentGeoJson = {
        type: "FeatureCollection",
        features: filteredFeatures
      };

      redrawLayers();
    }

    function resetFilters() {
      stateFilter.value = "";
      flyFilter.value = "";
      monthFilter.value = "";
      countySearch.value = "";

      currentGeoJson = rawGeoJson;
      redrawLayers();
    }

    function updateStats(features) {
      const totalRecords = features.length;
      const totalCount = features.reduce((sum, feature) => sum + getCount(feature), 0);
      const states = uniqueSorted(features, "state");
      const flies = uniqueSorted(features, "common_name");

      document.getElementById("visibleFeatures").textContent =
        totalRecords.toLocaleString();

      document.getElementById("visibleCount").textContent =
        Math.round(totalCount).toLocaleString();

      document.getElementById("uniqueStates").textContent =
        states.length.toLocaleString();

      document.getElementById("uniqueFlies").textContent =
        flies.length.toLocaleString();
    }

    function updateLegend(max) {
      const legend = document.getElementById("legend");

      const bins = [
        { label: "No detections", color: "#f7f7f7" },
        { label: "Low", color: "#ffffcc" },
        { label: "Medium-low", color: "#ffeda0" },
        { label: "Medium", color: "#feb24c" },
        { label: "High", color: "#f03b20" },
        { label: "Very high", color: "#bd0026" }
      ];

      legend.innerHTML = `
        <div style="margin: 6px 0 8px; color: #656d76;">
          Current max count: ${Number(max || 0).toLocaleString()}
        </div>
      `;

      for (const bin of bins) {
        legend.innerHTML += `
          <div class="legend-row">
            <span class="swatch" style="background: ${bin.color};"></span>
            <span>${bin.label}</span>
          </div>
        `;
      }
    }

    async function loadGeoJson() {
      try {
        const response = await fetch(GEOJSON_PATH);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();

        if (!data || data.type !== "FeatureCollection" || !Array.isArray(data.features)) {
          throw new Error("GeoJSON file is not a valid FeatureCollection.");
        }

        rawGeoJson = data;
        currentGeoJson = data;

        setupFilters(rawGeoJson);
        redrawLayers();

      } catch (error) {
        console.error(error);
        showError(
          "Could not load fruit_fly_data.geojson. Make sure index.html and fruit_fly_data.geojson are in the same folder, then run: python -m http.server 8000"
        );
      }
    }

    loadGeoJson();
  </script>
</body>
</html>
